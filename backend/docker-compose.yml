# Optional local stack for CarePath prototype
# Usage: docker compose up -d db
# Then set CAREPATH_USE_SQLITE=0 and DATABASE_URL accordingly

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carepath
      POSTGRES_PASSWORD: carepath
      POSTGRES_DB: carepath
    ports:
      - "5432:5432"
    volumes:
      - carepath_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carepath"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  carepath_pg:
